
name: 'supply_chain_slt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'supply_chain_slt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  supply_chain_slt:

    staging:
      +materialized: view
      +schema: staging
    
    marts:
      +materialized: table
      +schema: marts

snapshots:
  supply_chain_slt:
    +target_schema: snapshots
